name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        # GTK/CMake/Ninja: toolchain de Flutter desktop. build-essential:
        # el build hook de `sodium` compila libsodium con ./configure && make.
        # libsecret-1-dev: plugin nativo de flutter_secure_storage.
        # libayatana-appindicator3-dev: icono de bandeja (tray_manager, ADR 0012).
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev build-essential \
            libsecret-1-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux (release)
        run: flutter build linux --release

  # APK release y tests JVM del código nativo (revisión 2026-09-28: el
  # release nunca se compilaba y le faltaba el permiso INTERNET sin que
  # nadie lo notara). Sin los *_oauth_secrets.json, que no están en el
  # repo: la app compila igual, con la conexión a Google/Microsoft sin
  # configurar.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Kotlin unit tests (AutofillMatcher)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lockspire-android-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        run: flutter build windows --release

  # Protocolo + transporte IPC (ADR 0013) y native host. En los dos SO:
  # los tests de transporte usan el socket Unix / named pipe reales.
  bridge-and-native-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: lockspire_bridge
        working-directory: packages/lockspire_bridge
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test

      - name: native-host
        working-directory: native-host
        # bash también en Windows (Git Bash del runner): mismo script en
        # los dos sistemas, incluido `mkdir -p`.
        shell: bash
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
          # build/ está en .gitignore: en un checkout limpio no existe y
          # `dart compile exe` no crea el directorio de salida.
          mkdir -p build
          dart compile exe bin/lockspire_native_host.dart -o build/lockspire-native-host

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
