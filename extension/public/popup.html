<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Lockspire</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" width="24" height="24" />
      <h1>Lockspire</h1>
      <span id="site" class="site"></span>
    </header>

    <main>
      <p id="status" class="status" role="status" data-i18n="connecting"></p>
      <button id="primary-action" class="primary" hidden></button>
      <ul id="entries" class="entries" hidden></ul>
      <button id="choose-other" class="link" data-i18n="chooseOther" hidden></button>

      <section id="picker" class="picker" hidden>
        <p class="note" data-i18n="pickerNote"></p>
        <input id="filter" type="search" data-i18n-placeholder="filterPlaceholder" autocomplete="off" />
        <ul id="all-entries" class="entries"></ul>
      </section>
    </main>

    <section id="generator" class="generator" hidden>
      <button id="generate" class="secondary" data-i18n="generate"></button>
      <div id="generated-row" class="generated" hidden>
        <code id="generated"></code>
        <button id="copy" class="secondary" data-i18n="copy"></button>
      </div>
      <p id="generated-note" class="note" data-i18n="generatedNote" hidden></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
